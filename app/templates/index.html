<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ETL Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f5f5f0; min-height: 100vh; padding: 2rem; }
    .header { max-width: 640px; margin: 0 auto 2rem; }
    h1 { font-size: 24px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: #888; }
    .card { background: white; border-radius: 16px; border: 1px solid #e5e5e0; padding: 2rem; max-width: 640px; margin: 0 auto 1.5rem; }
    .drop-zone { border: 2px dashed #d0d0c8; border-radius: 12px; padding: 3rem 1rem; text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 1.5rem; }
    .drop-zone:hover, .drop-zone.dragover { border-color: #185FA5; background: #f0f6ff; }
    .drop-zone .icon { width: 48px; height: 48px; background: #e6f1fb; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
    .drop-zone p { font-size: 15px; font-weight: 500; color: #333; margin-bottom: 4px; }
    .drop-zone span { font-size: 12px; color: #999; }
    .file-name { font-size: 13px; color: #185FA5; margin-top: 10px; font-weight: 500; }
    input[type="file"] { display: none; }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.88; }
    .btn-primary { background: #185FA5; color: white; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .loader { display: none; text-align: center; padding: 2rem 0; }
    .spinner { width: 36px; height: 36px; border: 3px solid #e5e5e0; border-top-color: #185FA5; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader p { font-size: 13px; color: #888; }
    .error { background: #FCEBEB; color: #791F1F; border-radius: 8px; padding: 12px 16px; font-size: 13px; margin-top: 12px; display: none; }
    .history-card { background: white; border-radius: 16px; border: 1px solid #e5e5e0; padding: 1.5rem; max-width: 640px; margin: 0 auto; }
    .history-card h2 { font-size: 15px; font-weight: 500; color: #555; margin-bottom: 1rem; }
    .dataset-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0eb; }
    .dataset-item:last-child { border-bottom: none; }
    .dataset-name { font-size: 13px; font-weight: 500; color: #1a1a1a; }
    .dataset-meta { font-size: 11px; color: #999; margin-top: 2px; }
    .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .badge-ventes { background: #FAEEDA; color: #633806; }
    .badge-rh { background: #E6F1FB; color: #0C447C; }
    .badge-finance { background: #FAECE7; color: #712B13; }
    .badge-logistique { background: #EAF3DE; color: #27500A; }
    .badge-marketing { background: #EEEDFE; color: #3C3489; }
    .badge-generique { background: #F1EFE8; color: #5F5E5A; }
    .btn-view { font-size: 12px; color: #185FA5; text-decoration: none; padding: 5px 12px; border: 1px solid #185FA5; border-radius: 6px; }
    .btn-view:hover { background: #e6f1fb; }
    .empty { text-align: center; padding: 2rem; color: #aaa; font-size: 13px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>ETL Monitor</h1>
    <p class="subtitle">Uploadez vos données, obtenez un dashboard de KPIs instantané.</p>
  </div>

  <div class="card">
    <div class="drop-zone" id="dropZone">
      <div class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <p>Glissez votre fichier ici</p>
      <span>CSV, Excel ou JSON — max 10 MB</span>
      <div class="file-name" id="fileName"></div>
    </div>
    <input type="file" id="fileInput" accept=".csv,.xls,.xlsx,.json"/>
    <button class="btn btn-primary" id="uploadBtn" disabled>Analyser et générer le dashboard</button>
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p>Analyse en cours — détection du secteur et calcul des KPIs...</p>
    </div>
    <div class="error" id="errorBox"></div>
  </div>

  <div class="history-card">
    <h2>Datasets récents</h2>
    <div id="datasetList"><div class="empty">Aucun dataset uploadé pour l'instant.</div></div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileName = document.getElementById('fileName');
    const loader = document.getElementById('loader');
    const errorBox = document.getElementById('errorBox');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) selectFile(file);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) selectFile(fileInput.files[0]); });

    function selectFile(file) {
      fileName.textContent = file.name;
      uploadBtn.disabled = false;
      fileInput._file = file;
    }

    uploadBtn.addEventListener('click', async () => {
      const file = fileInput._file || fileInput.files[0];
      if (!file) return;
      errorBox.style.display = 'none';
      loader.style.display = 'block';
      uploadBtn.disabled = true;

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/api/v1/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Erreur serveur');
        window.location.href = `/api/v1/dashboard/${data.id}`;
      } catch (err) {
        loader.style.display = 'none';
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        uploadBtn.disabled = false;
      }
    });

    async function loadHistory() {
      try {
        const res = await fetch('/api/v1/datasets');
        const datasets = await res.json();
        const list = document.getElementById('datasetList');
        if (!datasets.length) return;
        list.innerHTML = datasets.map(d => `
          <div class="dataset-item">
            <div>
              <div class="dataset-name">${d.filename}</div>
              <div class="dataset-meta">${d.rows_count || 0} lignes · ${d.columns_count || 0} colonnes · ${d.created_at.slice(0,16).replace('T',' ')}</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="badge badge-${d.sector || 'generique'}">${d.sector || 'générique'}</span>
              ${d.status === 'done' ? `<a class="btn-view" href="/api/v1/dashboard/${d.id}">Voir →</a>` : `<span style="font-size:12px;color:#888">${d.status}</span>`}
            </div>
          </div>
        `).join('');
      } catch(e) {}
    }

    loadHistory();
    setInterval(loadHistory, 5000);
  </script>
</body>
</html>
